name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy zstandard pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Simulate and validate 2,000 rounds
        run: python -m kitchen_vs_fly.run --sims 2000 > /dev/null
